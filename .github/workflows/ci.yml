name: publish
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - "docs/**"
      - "renovate.json"
      - "GenerateDocumentation.cmd"
      - ".markdownlint.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*"
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  check_documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - run: dotnet run --project src/DocumentationGenerator/DocumentationGenerator.csproj
    - run: git status
      if: failure()

  compute_package_version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.compute-version.outputs.package_version }}
    steps:
    - id: compute-version
      name: Compute version
      run: |
        $(Invoke-WebRequest "https://www.nuget.org/api/v2/package/Meziantou.Analyzer/").BaseResponse.RequestMessage.RequestUri -match "meziantou\.analyzer\.3\.0\.([0-9]+).nupkg"
        $NewVersion = "3.0.$([int]$Matches.1 + 1)"
        if ($env:GITHUB_REF -ne 'refs/heads/main') {
          $NewVersion = $NewVersion + '-build.${{ github.run_id }}'
        }
        Write-Host "New version: $NewVersion"
        "package_version=$NewVersion" >> $env:GITHUB_OUTPUT

  create_nuget:
    runs-on: ubuntu-latest
    needs: [ compute_package_version ]
    env:
      RepositoryBranch: ${{github.ref}}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

    - run: dotnet run --project src/ListDotNetTypes/ListDotNetTypes.csproj -- src/Meziantou.Analyzer/Resources/

    # Meziantou.Analyzer.Pack references one project per Roslyn version, so this builds all of them in the right order
    - run: dotnet build src/Meziantou.Analyzer.Pack/Meziantou.Analyzer.Pack.csproj --configuration Release /p:Version=${{ needs.compute_package_version.outputs.package_version }} /bl:Meziantou.Analyzer.Pack.build.binlog

    - run: dotnet pack src/Meziantou.Analyzer.Pack/Meziantou.Analyzer.Pack.csproj --configuration Release --no-build /p:Version=${{ needs.compute_package_version.outputs.package_version }} /bl:Meziantou.Analyzer.Pack.pack.binlog
    - run: dotnet pack src/Meziantou.Analyzer.Annotations/Meziantou.Analyzer.Annotations.csproj --configuration Release /bl:Meziantou.Analyzer.Annotations.pack.binlog

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 3
        path: '**/*.nupkg'

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: binlog
        if-no-files-found: error
        retention-days: 3
        path: '**/*.binlog'

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET Core (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - name: Validate the content of the analyzer package
        run: |
          $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Filter *.nupkg | Where-Object { $_.Name -match '^Meziantou\.Analyzer\.\d' })
          if ($packages.Count -ne 1) {
            Write-Host "::error::Expected 1 Meziantou.Analyzer package, found $($packages.Count)"
            exit 1
          }

          # The expected Roslyn versions are the ones that have a project, the same way Meziantou.Analyzer.Pack discovers them
          $versions = @(Get-ChildItem "src/Meziantou.Analyzer/Meziantou.Analyzer.roslyn*.csproj" | ForEach-Object { $_.BaseName -replace '^.*\.(roslyn.*)$', '$1' })
          if ($versions.Count -eq 0) {
            Write-Host "::error::No Roslyn version specific project found"
            exit 1
          }

          $expected = $versions | ForEach-Object {
            "analyzers/dotnet/$_/cs/Meziantou.Analyzer.dll"
            "analyzers/dotnet/$_/cs/Meziantou.Analyzer.CodeFixers.dll"
          }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try { $entries = @($zip.Entries.FullName) } finally { $zip.Dispose() }

          $analyzers = @($entries | Where-Object { $_ -like 'analyzers/*' })
          $errors = @()
          $errors += $expected | Where-Object { $_ -notin $analyzers } | ForEach-Object { "Missing from the package: $_" }
          $errors += $analyzers | Where-Object { $_ -notin $expected } | ForEach-Object { "Unexpected analyzer in the package: $_" }
          # The analyzers must not be shipped as a regular library
          $errors += $entries | Where-Object { $_ -like 'lib/*' } | ForEach-Object { "The package must not contain any assembly under lib: $_" }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

          Write-Host "$($packages[0].Name) contains the analyzers for: $($versions -join ', ')"

      - name: Run dotnet validate
        run: |
          dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global
          $files = Get-ChildItem "${{ env.NuGetDirectory }}/*" -Recurse -Include *.nupkg
          $Errors = $false
          foreach($file in $files) {
              & meziantou.validate-nuget-package "$file"
              if ($LASTEXITCODE -ne 0) {
                $Errors = $true
              }
          }
          if ($Errors) {
            exit 1
          }

  build_and_test:
    runs-on: ${{ matrix.runs-on }}
    name: build_and_test (${{ matrix.runs-on }}, ${{ matrix.configuration }}, ${{ matrix.roslyn-version }}, shard ${{ matrix.shard-index }})
    env:
      TestResultsDirectory: ${{ github.workspace}}/TestResults
      TotalShards: 2
      # Options added by Meziantou.NET.Sdk.Test to every test run. They are set explicitly because
      # 'EnableDefaultTestSettings' has to be disabled: sharded-test lists the tests before running them,
      # and both '--report-trx' and '--minimum-expected-tests' make 'dotnet test --list-tests' report no test.
      # The trx report is passed on the sharded-test command line instead, so it is removed from the discovery
      # step and each batch writes a report with a distinct file name.
      MtpArguments: --report-gh --report-gh-slow-test-notices off --coverage --crashdump --crashdump-type mini --hangdump --hangdump-timeout 10m --hangdump-type mini
    strategy:
      matrix:
        runs-on: [ ubuntu-latest ]
        configuration: [ Release ]
        roslyn-version: [ 'roslyn4.8', 'roslyn4.14', 'roslyn5.0', 'roslyn5.6', 'roslyn5.9', 'default' ]
        shard-index: [ 1, 2 ]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET Core (global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - run: dotnet tool install --global Meziantou.ShardedTest --version 1.1.0
      name: Install sharded-test
    - run: >
        sharded-test
        --shard-index ${{ matrix.shard-index }}
        --total-shards ${{ env.TotalShards }}
        --project tests/Meziantou.Analyzer.Test/Meziantou.Analyzer.Test.csproj
        --configuration ${{ matrix.configuration }}
        --results-directory "${{ env.TestResultsDirectory }}"
        /p:RoslynVersion=${{ matrix.roslyn-version}}
        /p:EnableDefaultTestSettings=false
        "/p:TestingPlatformCommandLineArguments=${{ env.MtpArguments }}"
        --report-trx --report-trx-filename "report_{pid}.trx"
      name: Run tests
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: test-results-${{ matrix.runs-on }}-${{ matrix.roslyn-version }}-${{ matrix.configuration }}-shard${{ matrix.shard-index }}
        if-no-files-found: error
        retention-days: 3
        path: ${{ env.TestResultsDirectory }}/**/*

  deploy:
    runs-on: 'ubuntu-latest'
    needs: [ check_documentation, validate_nuget, build_and_test ]
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: nuget
        path: ${{ env.NuGetDirectory }}
    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - name: NuGet login (OIDC → temp API key)
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: meziantou
    - run: |
        Write-Host "Current ref: $env:GITHUB_REF"
        Write-Host "Searching nupkg in folder: ${{ env.NuGetDirectory }}"
        $files = Get-ChildItem "${{ env.NuGetDirectory }}/*" -Recurse -Include *.nupkg
        foreach($file in $files) {
            Write-Host "Pushing NuGet package: $($file.FullName)"
            if ($env:GITHUB_REF -eq 'refs/heads/main')
            {
              & dotnet nuget push "$($file.FullName)" --api-key "$env:NuGetApiKey" --source https://api.nuget.org/v3/index.json --force-english-output --skip-duplicate
            }
            else
            {
              & dotnet nuget push "$($file.FullName)" --api-key "$env:FeedzApiKey" --source https://f.feedz.io/meziantou/meziantou-analyzer/nuget/index.json --force-english-output --skip-duplicate
            }
        }
      name: Publish NuGet packages
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        NuGetApiKey: ${{steps.login.outputs.NUGET_API_KEY}}
        FeedzApiKey: ${{ secrets.FEEDZ_APIKEY }}

  create_release:
    runs-on: 'ubuntu-latest'
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ compute_package_version, deploy ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - run: 'gh release create "${{ needs.compute_package_version.outputs.package_version }}" --generate-notes --notes "NuGet package: <https://www.nuget.org/packages/Meziantou.Analyzer/${{ needs.compute_package_version.outputs.package_version }}>"'
      env:
        GH_TOKEN: ${{ github.token }}
