name: publish
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - "docs/**"
      - "renovate.json"
      - "GenerateDocumentation.cmd"
      - ".markdownlint.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*"
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  check_documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - run: dotnet run --project src/DocumentationGenerator/DocumentationGenerator.csproj
    - run: git status
      if: failure()

  check_pragmas:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Ensure no '#pragma warning disable' without a warning list
      run: |
        # A '#pragma warning disable' with no warning ID disables every warning until the end of the file
        $barePragmas = @(Get-ChildItem -Recurse -Filter *.cs | Select-String -Pattern '^\s*#pragma\s+warning\s+disable\s*(//.*)?$')
        if ($barePragmas.Count -gt 0) {
          $barePragmas | ForEach-Object {
            $path = (Resolve-Path -Relative -Path $_.Path) -replace '^\./', ''
            Write-Host "::error file=$path,line=$($_.LineNumber)::'#pragma warning disable' without a warning list disables every warning until the end of the file. List the warnings to disable."
          }
          exit 1
        }

        Write-Host "No '#pragma warning disable' without a warning list"

  compute_package_version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.compute-version.outputs.package_version }}
    steps:
    - id: compute-version
      name: Compute version
      run: |
        $(Invoke-WebRequest "https://www.nuget.org/api/v2/package/Meziantou.Analyzer/").BaseResponse.RequestMessage.RequestUri -match "meziantou\.analyzer\.3\.0\.([0-9]+).nupkg"
        $NewVersion = "3.0.$([int]$Matches.1 + 1)"
        if ($env:GITHUB_REF -ne 'refs/heads/main') {
          $NewVersion = $NewVersion + '-build.${{ github.run_id }}'
        }
        Write-Host "New version: $NewVersion"
        "package_version=$NewVersion" >> $env:GITHUB_OUTPUT

  create_nuget:
    runs-on: ubuntu-latest
    needs: [ compute_package_version ]
    env:
      RepositoryBranch: ${{github.ref}}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

    - run: dotnet run --project src/ListDotNetTypes/ListDotNetTypes.csproj -- src/Meziantou.Analyzer/Resources/

    # Meziantou.Analyzer.Pack references one project per Roslyn version, so this builds all of them in the right order
    - run: dotnet build src/Meziantou.Analyzer.Pack/Meziantou.Analyzer.Pack.csproj --configuration Release /p:Version=${{ needs.compute_package_version.outputs.package_version }} /bl:Meziantou.Analyzer.Pack.build.binlog

    - run: dotnet pack src/Meziantou.Analyzer.Pack/Meziantou.Analyzer.Pack.csproj --configuration Release --no-build /p:Version=${{ needs.compute_package_version.outputs.package_version }} /bl:Meziantou.Analyzer.Pack.pack.binlog
    - run: dotnet pack src/Meziantou.Analyzer.Annotations/Meziantou.Analyzer.Annotations.csproj --configuration Release /bl:Meziantou.Analyzer.Annotations.pack.binlog

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 3
        path: '**/*.nupkg'

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: binlog
        if-no-files-found: error
        retention-days: 3
        path: '**/*.binlog'

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup .NET Core (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}
      - name: Validate the content of the analyzer package
        run: |
          $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Filter *.nupkg | Where-Object { $_.Name -match '^Meziantou\.Analyzer\.\d' })
          if ($packages.Count -ne 1) {
            Write-Host "::error::Expected 1 Meziantou.Analyzer package, found $($packages.Count)"
            exit 1
          }

          # The expected Roslyn versions are the ones that have a project, the same way Meziantou.Analyzer.Pack discovers them
          $versions = @(Get-ChildItem "src/Meziantou.Analyzer/Meziantou.Analyzer.roslyn*.csproj" | ForEach-Object { $_.BaseName -replace '^.*\.(roslyn.*)$', '$1' })
          if ($versions.Count -eq 0) {
            Write-Host "::error::No Roslyn version specific project found"
            exit 1
          }

          $expected = $versions | ForEach-Object {
            "analyzers/dotnet/$_/cs/Meziantou.Analyzer.dll"
            "analyzers/dotnet/$_/cs/Meziantou.Analyzer.CodeFixers.dll"
          }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try { $entries = @($zip.Entries.FullName) } finally { $zip.Dispose() }

          $analyzers = @($entries | Where-Object { $_ -like 'analyzers/*' })
          $errors = @()
          $errors += $expected | Where-Object { $_ -notin $analyzers } | ForEach-Object { "Missing from the package: $_" }
          $errors += $analyzers | Where-Object { $_ -notin $expected } | ForEach-Object { "Unexpected analyzer in the package: $_" }
          # The analyzers must not be shipped as a regular library
          $errors += $entries | Where-Object { $_ -like 'lib/*' } | ForEach-Object { "The package must not contain any assembly under lib: $_" }

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$_" }
            exit 1
          }

          Write-Host "$($packages[0].Name) contains the analyzers for: $($versions -join ', ')"

      - name: Run dotnet validate
        run: |
          dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global
          $files = Get-ChildItem "${{ env.NuGetDirectory }}/*" -Recurse -Include *.nupkg
          $Errors = $false
          foreach($file in $files) {
              & meziantou.validate-nuget-package "$file"
              if ($LASTEXITCODE -ne 0) {
                $Errors = $true
              }
          }
          if ($Errors) {
            exit 1
          }

  list_test_projects:
    runs-on: ubuntu-latest
    outputs:
      test_projects: ${{ steps.list-test-projects.outputs.test_projects }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET Core (global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - name: Validate the Roslyn version specific projects
      run: |
        # The Roslyn version is the suffix of the project file name, e.g. Meziantou.Analyzer.roslyn4.8.csproj
        function Get-RoslynVersions($pattern) {
          @(Get-ChildItem $pattern | ForEach-Object { $_.BaseName -replace '^.*\.(roslyn[0-9.]+)$', '$1' } | Sort-Object)
        }

        $analyzers = Get-RoslynVersions "src/Meziantou.Analyzer/Meziantou.Analyzer.roslyn*.csproj"
        if ($analyzers.Count -eq 0) {
          Write-Host "::error::No Roslyn version specific project found"
          exit 1
        }

        # Every analyzer project must have a code fixer project and a test project of the same Roslyn version, and nothing more
        $expected = @{
          "src/Meziantou.Analyzer.CodeFixers/Meziantou.Analyzer.CodeFixers.<version>.csproj" = Get-RoslynVersions "src/Meziantou.Analyzer.CodeFixers/Meziantou.Analyzer.CodeFixers.roslyn*.csproj"
          "tests/Meziantou.Analyzer.Test/Meziantou.Analyzer.Test.<version>.csproj" = Get-RoslynVersions "tests/Meziantou.Analyzer.Test/Meziantou.Analyzer.Test.roslyn*.csproj"
        }

        $errors = @()
        foreach ($entry in $expected.GetEnumerator()) {
          $errors += $analyzers | Where-Object { $_ -notin $entry.Value } | ForEach-Object { "Missing project: $($entry.Key -replace '<version>', $_)" }
          $errors += $entry.Value | Where-Object { $_ -notin $analyzers } | ForEach-Object { "$($entry.Key -replace '<version>', $_) has no matching src/Meziantou.Analyzer/Meziantou.Analyzer.$_.csproj" }
        }

        if ($errors.Count -gt 0) {
          $errors | ForEach-Object { Write-Host "::error::$_" }
          exit 1
        }

        Write-Host "Every Roslyn version has an analyzer, a code fixer and a test project: $($analyzers -join ', ')"

        # The default version is the one the projects that are not specific to a Roslyn version resolve to
        $latest = @($analyzers | Sort-Object { [version]($_ -replace '^roslyn', '') })[-1]
        $default = "$(dotnet msbuild src/Meziantou.Analyzer.Pack/Meziantou.Analyzer.Pack.csproj -getProperty:RoslynVersion)".Trim()
        if ($default -ne $latest) {
          Write-Host "::error::The default Roslyn version is '$default' but the latest supported version is '$latest'. Update the RoslynVersion of the Directory.Build.props of the repository root."
          exit 1
        }

        Write-Host "The default Roslyn version is the latest supported one: $default"

    - id: list-test-projects
      name: List the test projects
      run: |
        # There is one test project per Roslyn version
        $projects = @(Get-ChildItem "tests/Meziantou.Analyzer.Test/Meziantou.Analyzer.Test.roslyn*.csproj" | ForEach-Object { $_.BaseName } | Sort-Object)
        if ($projects.Count -eq 0) {
          Write-Host "::error::No test project found"
          exit 1
        }

        Write-Host "Test projects: $($projects -join ', ')"
        "test_projects=$($projects | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT

  build_and_test:
    runs-on: ubuntu-latest
    needs: [ list_test_projects ]
    env:
      TestResultsDirectory: ${{ github.workspace}}/TestResults
    strategy:
      matrix:
        test-project: ${{ fromJSON(needs.list_test_projects.outputs.test_projects) }}
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup .NET Core (global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - run: dotnet test tests/Meziantou.Analyzer.Test/${{ matrix.test-project }}.csproj --configuration Release --results-directory "${{ env.TestResultsDirectory }}"
      name: Run tests
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()
      with:
        name: test-results-${{ matrix.test-project }}
        if-no-files-found: error
        retention-days: 3
        path: ${{ env.TestResultsDirectory }}/**/*

  deploy:
    runs-on: 'ubuntu-latest'
    needs: [ check_documentation, check_pragmas, validate_nuget, build_and_test ]
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: nuget
        path: ${{ env.NuGetDirectory }}
    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
    - name: NuGet login (OIDC → temp API key)
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: meziantou
    - run: |
        Write-Host "Current ref: $env:GITHUB_REF"
        Write-Host "Searching nupkg in folder: ${{ env.NuGetDirectory }}"
        $files = Get-ChildItem "${{ env.NuGetDirectory }}/*" -Recurse -Include *.nupkg
        foreach($file in $files) {
            Write-Host "Pushing NuGet package: $($file.FullName)"
            if ($env:GITHUB_REF -eq 'refs/heads/main')
            {
              & dotnet nuget push "$($file.FullName)" --api-key "$env:NuGetApiKey" --source https://api.nuget.org/v3/index.json --force-english-output --skip-duplicate
            }
            else
            {
              & dotnet nuget push "$($file.FullName)" --api-key "$env:FeedzApiKey" --source https://f.feedz.io/meziantou/meziantou-analyzer/nuget/index.json --force-english-output --skip-duplicate
            }
        }
      name: Publish NuGet packages
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        NuGetApiKey: ${{steps.login.outputs.NUGET_API_KEY}}
        FeedzApiKey: ${{ secrets.FEEDZ_APIKEY }}

  create_release:
    runs-on: 'ubuntu-latest'
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ compute_package_version, deploy ]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - run: 'gh release create "${{ needs.compute_package_version.outputs.package_version }}" --generate-notes --notes "NuGet package: <https://www.nuget.org/packages/Meziantou.Analyzer/${{ needs.compute_package_version.outputs.package_version }}>"'
      env:
        GH_TOKEN: ${{ github.token }}
